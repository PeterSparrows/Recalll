<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Courses — Recall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/app-shell.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-root"></div>
    <div>
      <div id="topbar-root"></div>
      <main class="content">
        <div class="page-header">
          <div><h1>Courses</h1><p>Group your materials by course — CSC401, MTH301, whatever fits.</p></div>
          <button class="btn btn--primary" id="new-course-btn">+ New course</button>
        </div>

        <div class="flex gap-8" style="margin-bottom:20px;">
          <button class="btn btn--ghost btn--sm is-active" data-filter="active">Active</button>
          <button class="btn btn--ghost btn--sm" data-filter="archived">Archived</button>
        </div>

        <div class="tile-grid" id="courses-grid">
          <div class="skeleton" style="height:150px;"></div>
          <div class="skeleton" style="height:150px;"></div>
          <div class="skeleton" style="height:150px;"></div>
        </div>
      </main>
    </div>
  </div>

  <!-- New / edit course modal -->
  <div class="modal-scrim" id="course-modal">
    <div class="modal glass-strong">
      <h3 id="course-modal-title">New course</h3>
      <p class="text-muted text-sm" style="margin-bottom:18px;">Give it a code and a title so it's easy to find later.</p>
      <form id="course-form">
        <input type="hidden" id="course-id" />
        <div class="field">
          <label for="course-code">Course code</label>
          <input class="input" id="course-code" placeholder="CSC401" required maxlength="20" />
        </div>
        <div class="field">
          <label for="course-title">Title</label>
          <input class="input" id="course-title" placeholder="Distributed Systems" required maxlength="150" />
        </div>
        <div class="field">
          <label for="course-desc">Description <span class="field-hint">(optional)</span></label>
          <textarea class="input" id="course-desc" maxlength="1000"></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn--ghost" id="course-modal-cancel">Cancel</button>
          <button type="submit" class="btn btn--primary">Save course</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-stack"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth-guard.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/courses.js"></script>
</body>
</html>
