<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz — Recall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/app-shell.css" />
  <link rel="stylesheet" href="assets/css/quiz-results.css" />
</head>
<body>
  <div class="quiz-shell">
    <header class="quiz-topbar">
      <div>
        <strong id="quiz-title-label">Quiz</strong>
        <div class="text-sm text-muted" id="quiz-question-count"></div>
      </div>
      <div class="quiz-progress-wrap">
        <div class="quiz-progress-label"><span>Progress</span><span id="progress-text">0 / 0 answered</span></div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%;"></div></div>
      </div>
      <div class="quiz-timer mono glass" id="quiz-timer">--:--</div>
    </header>

    <div class="quiz-body">
      <div class="quiz-question-panel glass card" id="quiz-panel">
        <div class="skeleton" style="height:200px;"></div>
      </div>
    </div>

    <footer class="quiz-nav-footer glass">
      <button class="btn btn--ghost" id="prev-btn" disabled>← Previous</button>
      <div class="question-jump-grid" id="jump-grid"></div>
      <button class="btn btn--primary" id="next-btn">Next →</button>
    </footer>
  </div>

  <!-- Submit confirmation -->
  <div class="modal-scrim" id="submit-modal">
    <div class="modal glass-strong">
      <h3>Submit quiz?</h3>
      <p class="text-muted text-sm" id="submit-modal-body">You've answered X of Y questions. You can't change answers after submitting.</p>
      <div class="modal-actions">
        <button class="btn btn--ghost" id="submit-modal-cancel">Keep working</button>
        <button class="btn btn--primary" id="submit-modal-confirm">Submit</button>
      </div>
    </div>
  </div>

  <div id="toast-stack"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth-guard.js"></script>
  <script src="assets/js/quiz.js"></script>
</body>
</html>
